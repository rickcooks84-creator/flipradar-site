<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; width: 290px;
    background: #07111a; color: #e6f0ea;
    font: 13px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { padding: 16px 16px 14px; }
  .brand { font-size: 15px; font-weight: 700; color: #00ff88; letter-spacing: .3px; margin-bottom: 12px; }
  .status { display: flex; gap: 9px; align-items: flex-start; padding: 11px 12px; border-radius: 9px;
            background: #0b1722; border: 1px solid #13283a; }
  .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex: none; background: #5a7385; }
  .dot.ok { background: #00ff88; box-shadow: 0 0 8px #00ff8899; }
  .dot.warn { background: #ffb020; }
  .dot.bad { background: #ff4d4d; }
  .headline { font-weight: 600; color: #fff; }
  .detail { color: #9fb4c2; font-size: 12px; margin-top: 2px; }
  a.btn { display: block; margin-top: 11px; text-align: center; text-decoration: none;
          background: #00ff88; color: #03210f; font-weight: 700; padding: 9px; border-radius: 8px; }
  a.btn.ghost { background: transparent; color: #00ff88; border: 1px solid #00ff8855; font-weight: 600; }
  .foot { margin-top: 13px; padding-top: 11px; border-top: 1px solid #13283a;
          color: #5a7385; font-size: 11px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">FlipSonar 🛰️</div>
    <div class="status">
      <div class="dot" id="dot"></div>
      <div>
        <div class="headline" id="headline">Checking eBay…</div>
        <div class="detail" id="detail">Reading a sold search through your session.</div>
      </div>
    </div>
    <div id="actions"></div>
    <div class="foot">Your eBay login stays in this browser. FlipSonar never receives it.</div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
